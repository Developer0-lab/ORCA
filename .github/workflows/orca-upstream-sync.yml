name: Sync latest upstream foundation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNC to replace upstream-owned files with the latest MooreSi/forex-gold main branch"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orca-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out ORCA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest upstream main
        run: |
          git clone --depth 1 --branch main https://github.com/MooreSi/forex-gold.git /tmp/orca-upstream

      - name: Replace upstream-owned files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='README.md' \
            --exclude='ORCA-FOUNDATION.md' \
            /tmp/orca-upstream/ ./

      - name: Commit upstream snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already synchronized with upstream."
          else
            git commit -m "Import latest MooreSi/forex-gold upstream"
            git push
          fi
